on: push
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.18.0'

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "NX_PUBLIC_API_URL=${{ secrets.NX_PUBLIC_API_URL }}" >> .env
          echo "NX_PUBLIC_GMAPS_ID=${{ secrets.NX_PUBLIC_GMAPS_ID }}" >> .env
          echo "NX_PUBLIC_GMAPS_API_KEY=${{ secrets.NX_PUBLIC_GMAPS_API_KEY }}" >> .env

      - name: Build app
        run: npm run build portal

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.server }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}
          protocol: 'ftp' # Add this line to switch to SFTP
          local-dir: ./dist/apps/portal/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            fileToExclude.txt
